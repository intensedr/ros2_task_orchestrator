tasks:
  - task_name: drone/takeoff
    topic: /drone/takeoff
    msg_interface: task_orchestrator_drone_msgs/action/Takeoff
    task_server_type: action
    blocking: true
    cancel_on_stop: true
    cancel_reported_as_success: false
    reentrant: false
    priority_default: 0
    cancel_timeout: 10.0
    server_timeout: 5.0
    result_timeout: 0.0
    resources: [airframe]
    tags: [drone, flight, takeoff]
    task_group: drone_flight
    capability_tags: [flight, localization]
    zone_locked: false
    admission:
      min_battery_percent: 20.0
      requires_localization: true
      allow_emergency_stop: false

