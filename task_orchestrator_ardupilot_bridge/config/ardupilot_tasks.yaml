tasks:
  - task_name: drone/arm
    topic: /drone/arm
    msg_interface: task_orchestrator_drone_msgs/action/Arm
    task_server_type: action
    blocking: true
    cancel_on_stop: false
    reentrant: false
    server_timeout: 5.0
    result_timeout: 15.0
    cancel_timeout: 5.0
    resources: [airframe]
    tags: [drone, flight, arming]
    task_group: drone_flight
    capability_tags: [flight, localization]
    admission:
      min_battery_percent: 20.0
      requires_localization: true
      allow_emergency_stop: false

  - task_name: drone/takeoff
